services:

  backend:
    build: .
    container_name: task-management-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: "mysql://root:001001@mysql:3306/Task_Management_System_v2"
      JWT_SECRET: "mySecretKey"
      MINIO_ENDPOINT: "minio"
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_BUCKET: "task-management"
    depends_on:
      - mysql
      - minio

  mysql:
    image: mysql:8.0
    container_name: task-management-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "001001"
      MYSQL_DATABASE: "Task_Management_System_v2"
    volumes:
      - mysql_data:/var/lib/mysql

  minio:
    image: minio/minio
    container_name: task-management-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  minio_data: